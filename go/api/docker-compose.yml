services:
  postgres:
    image: postgres:16-alpine
    container_name: planetary-postgres
    environment:
      POSTGRES_USER: planetary
      POSTGRES_PASSWORD: planetary
      POSTGRES_DB: planetary
    ports:
      - "5432:5432"
    volumes:
      - planetary-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planetary -d planetary"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  planetary-pgdata:
