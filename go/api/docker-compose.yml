services:
  postgres:
    image: postgres:16-alpine
    container_name: sunred-postgres
    environment:
      POSTGRES_USER: sunred
      POSTGRES_PASSWORD: sunred
      POSTGRES_DB: sunred
    ports:
      - "5432:5432"
    volumes:
      - sunred-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunred -d sunred"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  sunred-pgdata:
