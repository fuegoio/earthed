services:
  postgres:
    image: postgres:16-alpine
    container_name: earthed-postgres
    environment:
      POSTGRES_USER: earthed
      POSTGRES_PASSWORD: earthed
      POSTGRES_DB: earthed
    ports:
      - "5432:5432"
    volumes:
      - earthed-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthed -d earthed"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  earthed-pgdata:
